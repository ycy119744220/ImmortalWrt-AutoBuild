name: check-upstream

# 每天定时 + 手动触发：取 immortalwrt 最新「正式版」tag（排除 rc / beta / alpha / snapshot），
# 与本仓库已有 Release 比对，只有出现新正式版才调用 build.yml。
on:
  schedule:
    - cron: '0 20 * * *'   # 每天 UTC 20:00（北京时间 04:00）
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-upstream.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '即使该版本已发布过也强制重新编译'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.pick.outputs.should_build }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: 取上游最新正式 tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "==> 列出 immortalwrt/immortalwrt 的 tag"
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/immortalwrt/immortalwrt/tags?per_page=100" \
            | grep -o '"name": *"[^"]*"' | sed 's/.*: *"//; s/"$//' > /tmp/tags.txt
          echo "--- 上游 tag（前 30 个）---"
          head -30 /tmp/tags.txt

          # 正式版形如 v25.12.2 / v24.10.5；排除任何带 rc/beta/alpha/snapshot 的候选版本
          TAG=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' /tmp/tags.txt \
                | grep -viE 'rc|beta|alpha|snapshot' \
                | sort -V | tail -1 || true)

          if [ -z "${TAG:-}" ]; then
            echo "!! 没有匹配到任何正式版 tag"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "==> 最新正式版: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # 是否已经有该 tag 的 Release
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "==> $TAG 已发布过"
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "==> 手动要求强制重编"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "==> $TAG 尚未发布，触发编译"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  dispatch:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 触发 build.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          echo "==> 触发 build.yml，tag=$TAG"
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
          sleep 5
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --limit 3 || true
