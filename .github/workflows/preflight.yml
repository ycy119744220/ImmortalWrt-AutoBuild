name: preflight

# 不编译，只验证整条配置链是否成立，8-12 分钟。
# 用途：在花 3-5 小时编译之前，先把「拉源 / 官方 feed 有包 / 删桩文件 / 两个本地包能构建 /
#       Kconfig 符号正确」这些坑炸出来。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'package/**'
      - 'files/**'
      - '.github/workflows/preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: 安装依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          # python3-distutils 在 Ubuntu 24.04 已被移除（Python 3.12 删掉 distutils），
          # 直接写进安装列表会 "has no installation candidate" 整步失败。
          # 用 || true 单独装，装上了是加分，装不上也不影响。
          sudo apt-get -y install python3-distutils || true
          sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev rsync \
            unzip zlib1g-dev file wget curl pigz subversion \
            device-tree-compiler libelf-dev python3-setuptools

      - name: 拉源码与官方 feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/*.sh scripts/*.py
          ./scripts/feeds.sh "$(./scripts/resolve_tag.sh)"

      - name: 删除官方 OpenClash 桩数据文件
        run: ./scripts/strip_oc_assets.sh openwrt

      - name: 生成并校验 .config
        run: |
          set -euo pipefail
          ./scripts/prepare_config.sh config/x86_64.config config/ci-extra.config /tmp/base.config
          cp /tmp/base.config openwrt/.config
          mkdir -p openwrt/files
          cp -a files/common/. openwrt/files/
          cd openwrt
          make defconfig
          cd ..
          python3 scripts/verify_config.py openwrt/.config

      - name: 单独构建两个本地包（验证内核下载与 4 库下载）
        run: |
          set -euo pipefail
          cd openwrt
          set -o pipefail
          make package/openclash-core-meta/compile V=s 2>&1 | tee /tmp/core.log
          make package/openclash-geo-db/compile V=s 2>&1 | tee /tmp/geo.log

      - name: 检查两个本地包的产出
        run: |
          set -euo pipefail
          echo "==> 内核"
          ls -lh openwrt/build_dir/target-*/openclash-core-meta*/root/etc/openclash/core/ 2>/dev/null || true
          f=$(find openwrt/build_dir -path '*openclash-core-meta*' -name clash_meta | head -1)
          [ -n "$f" ] || { echo "!! 没有产出 clash_meta"; exit 1; }
          sz=$(stat -c '%s' "$f"); echo "    clash_meta $sz 字节"
          [ "$sz" -gt 20000000 ] || { echo "!! 内核体积异常"; exit 1; }
          "$f" -v || { echo "!! 内核不可执行"; exit 1; }

          echo "==> 数据库"
          d=$(find openwrt/build_dir -path '*openclash-geo-db*' -name 'out' -type d | head -1)
          [ -n "$d" ] || { echo "!! 没有产出 out 目录"; exit 1; }
          ls -l "$d"
          for n in Country.mmdb GeoSite.dat GeoIP.dat ASN.mmdb; do
            [ -s "$d/$n" ] || { echo "!! 缺 $n"; exit 1; }
          done

      - name: 报告
        if: always()
        run: |
          {
            echo "### preflight 结果"
            echo '```'
            grep -E 'RUBY|YJIT' openwrt/.config || echo '(no yjit lines)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时上传配置与日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-debug
          path: |
            openwrt/.config
            /tmp/core.log
            /tmp/geo.log
          if-no-files-found: warn
          include-hidden-files: true
