name: preflight

# 不编译固件，只验证整条配置链是否成立，约 5-8 分钟。
# 用途：在花 3-5 小时编译之前，先把这些坑炸出来 ——
#   拉源码 / 官方 feed 里确实有 Argon·UPnP·OpenClash / 桩文件已删 /
#   驱动裁剪与挂载点移除生效 / Kconfig 符号正确 /
#   两个本地包的 Makefile 能被解析 / 内核与四个数据库的下载通道与哈希都可验证。
#
# 注意：这里 **不编这两个本地包**。它们的依赖链会牵出 package/kernel/linux，
# 详见下方"下载并校验内核 + 四个数据库"步骤里的注释。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'package/**'
      - 'files/**'
      - '.github/workflows/preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 安装依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          # python3-distutils 在 Ubuntu 24.04 已被移除（Python 3.12 删掉 distutils），
          # 直接写进安装列表会 "has no installation candidate" 整步失败。
          # 用 || true 单独装，装上了是加分，装不上也不影响。
          sudo apt-get -y install python3-distutils || true
          sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev rsync \
            unzip zlib1g-dev file wget curl pigz subversion \
            device-tree-compiler libelf-dev python3-setuptools

      - name: 拉源码与官方 feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/*.sh scripts/*.py
          ./scripts/feeds.sh "$(./scripts/resolve_tag.sh)"

      - name: 删除官方 OpenClash 桩数据文件
        run: ./scripts/strip_oc_assets.sh openwrt

      - name: 精简 x86 网卡/显卡驱动 + 移除挂载点
        run: |
          set -euo pipefail
          # 必须和 build.yml 保持一致：preflight 不跑这一步的话，
          # block-mount / automount 会因为 DEFAULT_PACKAGES 被拉回来而假失败。
          python3 scripts/trim_x86.py openwrt/target/linux/x86/image/64.mk

      - name: 生成并校验 .config
        run: |
          set -euo pipefail
          ./scripts/prepare_config.sh config/x86_64.config config/ci-extra.config /tmp/base.config
          cp /tmp/base.config openwrt/.config
          mkdir -p openwrt/files
          cp -a files/common/. openwrt/files/
          cd openwrt
          make defconfig
          cd ..
          python3 scripts/verify_config.py openwrt/.config

      - name: 静态检查两个本地包 Makefile + 全部脚本
        run: |
          set -euo pipefail
          echo "==> shell 脚本语法"
          for s in scripts/*.sh; do
            bash -n "$s" && echo "    OK  $s"
          done
          echo "==> python 脚本语法"
          for s in scripts/*.py; do
            python3 -m py_compile "$s" && echo "    OK  $s"
          done

          echo "==> 两个本地包的 Makefile 关键字段"
          # 不调用 make。
          # 试过三种 make 姿势，全部不可靠：
          #   1) `make package/<pkg>/dump`      → package/Makefile 没这个目标，
          #      落到 toplevel.mk 的 `%::` 兜底规则，只报 "build failed. Please re-run make -j1 V=s"。
          #   2) `make -C package/<pkg> DUMP=1` → TOPDIR 未导出，
          #      include 变成 "/package.mk: No such file or directory"。
          #   3) `make package/<pkg>/compile DUMP=1`（在 openwrt 根目录）→ 确实进了 dumpinfo，
          #      但仍会先跑 target/linux/prereq，而 ARCH 还没从 .config 载入，
          #      报 "prereq: No such file or directory"，staging_dir 出现 target-_ 这种空 ARCH 目录。
          # 结论：preflight 阶段（toolchain 尚未构建）不适合让 make 解析包。
          # 真正能编译通过与否，由 build.yml 的完整 make 负责；这里只做确定性最高的静态检查。
          for dir in openclash-core-meta openclash-geo-db; do
            mk="openwrt/package/$dir/Makefile"
            [ -f "$mk" ] || { echo "!! 缺少 $mk"; exit 1; }

            # PKG_NAME 必须等于目录名，否则 CONFIG_PACKAGE_<name>=y 选不中它
            name=$(sed -n 's/^PKG_NAME:=//p' "$mk" | head -1 | tr -d ' \t')
            [ "$name" = "$dir" ] || {
              echo "!! $dir 的 PKG_NAME=$name，与目录名不一致（CONFIG_PACKAGE_$name 才对）"
              exit 1
            }

            # 必须注册成包，否则不会被编进固件
            grep -q 'BuildPackage,' "$mk" || { echo "!! $mk 没有调用 BuildPackage"; exit 1; }
            # 必须有 install 段，否则包装出来是空的
            # install 段通常写作 `define Package/$(PKG_NAME)/install`（用变量），
            # 也允许写死包名，两种都算通过
            grep -qE "define Package/(\\$\(PKG_NAME\)|$dir)/install" "$mk" || {
              echo "!! $mk 没有 install 段"; exit 1
            }

            deps=$(sed -n 's/^[[:space:]]*DEPENDS:=\(.*\)$/\1/p' "$mk" | head -1)
            echo "    OK  $dir  (PKG_NAME=$name)"
            echo "        DEPENDS: ${deps:-（无）}"
          done
          echo "    （以上为静态解析；能否真正编译由 build.yml 的完整 make 决定）"

      - name: 下载并校验内核 + 四个数据库（与包 Makefile 同一套规则）
        run: |
          set -euo pipefail
          # 这一步刻意 **不编译** 这两个包。
          # openclash-core-meta 的 DEPENDS 是 +luci-app-openclash，
          # 而 luci-app-openclash 依赖 kmod-tun / kmod-nft-tproxy / kmod-inet-diag，
          # 于是 `make package/openclash-core-meta/compile` 会把 package/kernel/linux
          # 整棵内核模块树拉起来编，最后死在
          #   install: cannot stat '.../linux-6.12.103/modules.builtin': No such file
          # —— 因为 <pkg>/compile 不会先编内核。这条路要么等 3 小时编完整机，要么走不通。
          # 真正的打包与安装交给 build.yml（完整 make，内核本来就会编）。
          chmod +x scripts/fetch-check.sh
          ./scripts/fetch-check.sh "$RUNNER_TEMP/oc-assets" 2>&1 | tee /tmp/fetch.log
          grep -q "全部通过" /tmp/fetch.log || { echo "!! fetch-check 未通过"; exit 1; }

      - name: 报告
        if: always()
        run: |
          {
            echo "### preflight 结果"
            echo '```'
            grep -E 'RUBY|YJIT' openwrt/.config || echo '(no yjit lines)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时上传配置与日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-debug
          path: |
            openwrt/.config
            /tmp/fetch.log
          if-no-files-found: warn
          include-hidden-files: true
