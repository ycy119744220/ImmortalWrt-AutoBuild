name: build

# 编译 ImmortalWrt x86_64，产出「普通版」与「preconfigured 预配置版」并发布到本仓库 Releases
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'ImmortalWrt 上游 tag（留空=自动取最新正式版）'
        required: false
        default: ''
      skip_publish:
        description: '只编译不发布（调试用）'
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.tag || 'latest' }}
  cancel-in-progress: false

env:
  # 关掉遥测/交互式提示，保证 make 全自动
  DEBIAN_FRONTEND: noninteractive
  FORCE_UNSAFE_CONFIGURE: '1'
  # ---------------------------------------------------------------------------
  # ccache 环境变量（配合下面 actions/cache 的 openwrt/.ccache）
  #
  # CCACHE_BASEDIR + CCACHE_NOHASHDIR 是命中率的命门：
  #   runner 上源码路径每次都变（/home/runner/work/...），而 ccache 默认会把
  #   **绝对路径**写进哈希。不设 BASEDIR 的话，换一次工作目录就全部 miss。
  #   BASEDIR 会把路径改写成相对路径，NOHASHDIR 再把所在目录本身从哈希里去掉。
  #
  # CCACHE_COMPILERCHECK=content：默认按 mtime 判断编译器是否变化，
  #   runner 每次重新 apt 装 gcc，mtime 一定不同 → 全部 miss。
  #   改成按编译器文件内容哈希，只要 gcc 版本没变就一直命中。
  #
  # CCACHE_MAXSIZE=4G：缓存上限。太小会频繁淘汰（LRU），命中率上不去。
  #   实测 run 40453553423 首次冷编译后就有 948MB / 29118 次可缓存调用；
  #   下次命中率升高后目标文件总量会继续增长，2G 太紧，放到 4G 留足余量。
  #   GitHub 单仓库 cache 总额 10GB，4G 占 40%，可接受。
  # ---------------------------------------------------------------------------
  # 注意：make 内部 rules.mk 会把 CCACHE_DIR 覆盖成 $(TOPDIR)/.ccache，
  # 与本处路径相同（TOPDIR 即 openwrt/），所以 actions/cache 的 path 能对上。
  # 真正决定命中率的是下面这几个不被 rules.mk 覆盖的变量。
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}/openwrt
  CCACHE_NOHASHDIR: 'true'
  CCACHE_COMPILERCHECK: 'content'
  CCACHE_MAXSIZE: '4G'
  CCACHE_CPP2: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 解析上游 tag
        id: ver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            # 统一走 resolve_tag.sh：带 token 认证，API 限流时自动退回 git ls-remote
            chmod +x scripts/resolve_tag.sh
            TAG=$(./scripts/resolve_tag.sh)
          fi
          [ -n "$TAG" ] || { echo "!! 解析 tag 失败"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "==> 目标版本: $TAG"

      # ---------------------------------------------------------------------
      # ccache：整机编译 61 分钟里有 54 分钟在 make，这是唯一能大幅压缩的地方。
      # 配置里早就有 CONFIG_CCACHE=y，但一直没给 .ccache 做持久化，
      # 每次 runner 全新，等于一直冷启动。
      #
      # key 的选择（吃过教训，务必保留注释）：
      #   - 主键带上 tag：上游换版本时 patch 级改动会变，旧缓存命中率极低，
      #     带上 tag 可以自然失效，避免"拿旧目标文件编出不一致的固件"。
      #   - 后缀用 run_id：每次运行都写一份新的，restore-keys 前缀匹配取最近的旧缓存。
      #     GitHub cache 一旦创建就不可改，用固定 key 会导致永远命中第一次那份。
      #   - key 里**不放** .config 哈希：配置改一次就整体失效太浪费，
      #     改配置最多是部分未命中（ccache 自己按源文件+参数判命中）。
      # ---------------------------------------------------------------------
      - name: 恢复 ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ runner.os }}-${{ steps.ver.outputs.tag }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.ver.outputs.tag }}-
            ccache-${{ runner.os }}-

      - name: 安装编译依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          # python3-distutils 在 Ubuntu 24.04 已被移除（Python 3.12 删掉 distutils），
          # 混在主列表里会让整条 apt-get install 以 exit 100 失败。
          sudo apt-get -y install python3-distutils || true
          sudo apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip \
            zlib1g-dev file wget curl pigz subversion device-tree-compiler \
            python3-setuptools libelf-dev
          # ccache 二进制本身：Ubuntu 镜像通常预装，没装就补一个（几百 KB）
          command -v ccache >/dev/null 2>&1 || sudo apt-get -y install ccache
          ccache --version | head -1

      - name: 拉源码与官方 feeds
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh scripts/*.py
          ./scripts/feeds.sh "${{ steps.ver.outputs.tag }}"

      - name: 删除官方 OpenClash 自带桩数据文件（避免 apk 覆盖冲突）
        run: ./scripts/strip_oc_assets.sh openwrt

      - name: 生成 .config
        run: |
          set -euo pipefail
          ./scripts/prepare_config.sh config/x86_64.config config/ci-extra.config /tmp/base.config
          cp /tmp/base.config openwrt/.config
          cd openwrt
          # 注入两个镜像共用的首启脚本（Argon + 中文）
          mkdir -p files
          cp -a ../files/common/. files/
          make defconfig

      - name: 精简 x86 网卡/显卡驱动
        run: |
          set -euo pipefail
          python3 scripts/trim_x86.py openwrt/target/linux/x86/image/64.mk

      - name: 二次 defconfig + 校验
        run: |
          set -euo pipefail
          cd openwrt
          make defconfig
          cd ..
          python3 scripts/verify_config.py openwrt/.config

      - name: 下载依赖包（失败重试三次）
        run: |
          set -euo pipefail
          cd openwrt
          # 同样把日志收进文件：download 阶段几万行输出会把 step 日志刷爆，
          # 真正有用的只有末尾那串 "Failed to download"。
          for i in 1 2 3; do
            echo "==> make download 第 $i 次"
            if make -j"$(nproc)" download >../download.log 2>&1; then
              echo "==> download 成功（日志 $(wc -l <../download.log) 行）"
              exit 0
            fi
            echo "!! download 有失败项，清单如下："
            grep -iE 'failed to download|error [0-9]+|Hash mismatch|no more mirrors' ../download.log | head -50 || true
            echo "   日志尾部 50 行："
            tail -50 ../download.log
            sleep 10
          done
          echo "!! download 连续三次失败"
          exit 1

      - name: 编译
        run: |
          set -euo pipefail
          cd openwrt
          # 缓存恢复后在日志里确认 BASEDIR/COMPILERCHECK 真的生效了，
          # 这三个值不对，命中率会直接掉到接近 0（且没有任何报错提示）。
          # 注意：CCACHE_DIR / CCACHE_BASEDIR 在 make 内部会被 rules.mk 重新赋值
          # （CCACHE_BASEDIR := $(TOPDIR)，CCACHE_DIR := $(TOPDIR)/.ccache），
          # 这里的 echo 打印的是 make 之外的 shell 值，仅作参考。
          echo "==> ccache 环境（shell 侧）"
          echo "    CCACHE_DIR          = ${CCACHE_DIR:-<未设置>}"
          echo "    CCACHE_BASEDIR      = ${CCACHE_BASEDIR:-<未设置>}"
          echo "    CCACHE_COMPILERCHECK= ${CCACHE_COMPILERCHECK:-<未设置>}"
          echo "    CCACHE_MAXSIZE      = ${CCACHE_MAXSIZE:-<未设置>}"
          ccache --max-size="$CCACHE_MAXSIZE" 2>/dev/null || true

          # 硬性断言：ccache 必须真的接上。
          # 背景：config/Config-devel.in 里 `config CCACHE` 带 `if DEVEL`，
          # DEVEL=n 时该符号不可见，defconfig 会把 CONFIG_CCACHE=y 静默删掉，
          # make 里的 `ifneq ($(CONFIG_CCACHE),)` 不成立 → ccache 全程不参与。
          # 实测 run 40445331733：编译 4051 秒，ccache 前后均 0.0GB。
          echo "==> ccache 接线检查"
          if ! grep -qx 'CONFIG_CCACHE=y' .config; then
            echo "!! .config 里没有 CONFIG_CCACHE=y —— ccache 不会生效，直接失败"
            grep -iE '^#? ?CONFIG_(CCACHE|DEVEL)' .config || echo "   (一行都没有，说明被 defconfig 丢弃)"
            exit 1
          fi
          echo "    OK  CONFIG_CCACHE=y"
          echo "    .ccache 实际路径将由 rules.mk 决定（CCACHE_DIR 环境变量会被其覆盖）"
          echo "==> 编译前 ccache 统计"
          ccache -s -v 2>&1 | head -30 || true
          du -sh "$CCACHE_DIR" 2>/dev/null || echo "    (.ccache 目录不存在)"

          # 日志写文件再回放，不用 `| tee`：
          # 整机编译 V=s 的日志能到数 GB，tee 会让每行同时走「写文件 + 写 stdout」，
          # Actions 端还要再落一次盘，IO 打满后编译会莫名变慢甚至假死。
          # 这里成功后不打印（避免 GB 级 step 日志），失败才回放尾部。
          start=$(date +%s)
          set +e
          make -j"$(nproc)" V=s >../build.log 2>&1
          rc=$?
          set -e
          echo "==> make 退出码 $rc，耗时 $(( $(date +%s) - start )) 秒，日志 $(wc -l <../build.log) 行 / $(du -h ../build.log | cut -f1)"

          echo "==> 编译后 ccache 统计（命中率直接决定下一次快多少）"
          ccache -s -v 2>&1 | head -30 || true
          du -sh "$CCACHE_DIR" 2>/dev/null || echo "    (.ccache 目录不存在)"

          if [ "$rc" -ne 0 ]; then
            echo "!! 编译失败，尾部 300 行："
            tail -300 ../build.log
            exit "$rc"
          fi

      - name: 上传编译日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ steps.ver.outputs.tag }}
          path: build.log
          retention-days: 7
          if-no-files-found: warn

      - name: 固件自检
        run: ./scripts/verify_firmware.sh

      - name: 生成预配置版镜像
        run: |
          set -euo pipefail
          ./scripts/make_preconfigured.sh "${{ steps.ver.outputs.tag }}" \
            files/preconfigured release-out

      - name: 收集产物
        run: ./scripts/collect.sh "${{ steps.ver.outputs.tag }}" release-out release-out

      - name: 保存 .config 作为 artifact
        uses: actions/upload-artifact@v7
        with:
          name: config-${{ steps.ver.outputs.tag }}
          path: openwrt/.config
          retention-days: 30
          include-hidden-files: true

      - name: Checksums（只打印进日志）
        run: |
          set -euo pipefail
          cd release-out
          echo "==> SHA256"
          sha256sum *.img.gz | tee /tmp/sha256.txt
          {
            echo "SHA256:"
            echo '```'
            cat /tmp/sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 删除同 tag 的旧 Release（重跑时避免附件残留）
        if: ${{ !inputs.skip_publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "==> 删除已有 Release $TAG"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            echo "==> 没有旧 Release"
          fi

      - name: 发布 Release
        if: ${{ !inputs.skip_publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          cat > /tmp/notes.md <<EOF
          ## ImmortalWrt ${TAG} · x86_64 · UEFI

          上游仓库：\`immortalwrt/immortalwrt\`，tag \`${TAG}\`
          构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')
          构建人：@${{ github.actor }}

          ### 版本号说明
          本 Release 的 tag 与上游 tag 一致（\`${TAG}\`），可直接对应上游发布版本。
          固件文件名中的版本号由编译产物决定，实际见下方附件。

          ### 产物（共 2 个）
          | 文件 | 说明 |
          |---|---|
          | \`*-ext4-combined-efi.img.gz\` | 普通版，出厂默认配置 |
          | \`*-ext4-combined-efi-preconfigured.img.gz\` | 预配置版，额外带初始网络/租约/转发/UPnP |

          ### 两个镜像都包含
          - 默认简体中文界面
          - 默认 Argon 主题（含主题设置页）
          - UPnP（miniupnpd-nftables）
          - OpenClash（官方包）+ Mihomo Meta 内核 + 四个数据库（预置，无需联网下载）
          - 已移除「挂载点」菜单
          - 仅保留 igc（i225/i226）等必要网卡驱动

          ### 预配置版额外内容
          - LAN \`192.168.1.1/24\`，DHCP 池 \`.100-.199\`，租期 12h
          - WAN 为 PPPoE 模板（账号密码留空）
          - 4 条静态租约、5 条端口转发（指向 \`192.168.88.254\`）
          - UPnP 开启，时区 Asia/Shanghai

          > 静态租约与端口转发写的是 \`192.168.88.x\`，只有 LAN 处于 \`192.168.88.0/24\` 时才生效。
          > 把 LAN 改为 \`192.168.88.1\` 后立即生效。

          ### 校验值
          见本次构建日志的 \`Checksums\` 步骤。

          ### 刷写
          1. 解压 \`.img.gz\` 得到 \`.img\`
          2. Etcher / Rufus / \`dd\` 写入 U 盘或 SSD
          3. **UEFI** 引导（本仓库不编译 BIOS/Legacy 镜像）
          4. 网线接 LAN 口，浏览器打开 \`http://192.168.1.1\`
          5. 首次登录必须设置 root 密码
          EOF
          gh release create "$TAG" release-out/*.img.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "ImmortalWrt ${TAG} · x86_64" \
            --notes-file /tmp/notes.md
          echo "==> 已发布"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
