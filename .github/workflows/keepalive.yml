name: keepalive

# 保活：每月 1 号只提交一个带时间戳的 .keepalive 文件。
# 不编译、不发布、无第三方依赖，通常 5-10 秒结束。
# 作用：GitHub 对长期无提交的定时任务会自动停用（60 天），本工作流让仓库保持活跃。
on:
  schedule:
    - cron: '0 3 1 * *'   # 每月 1 号 UTC 03:00（北京时间 11:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 只取最新一个提交，进一步压缩耗时
          fetch-depth: 1

      - name: 写时间戳并提交
        run: |
          set -euo pipefail
          ts=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          printf 'keepalive %s\n' "$ts" > .keepalive
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .keepalive
          if git diff --cached --quiet; then
            echo "==> 内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(keepalive): $ts"
          git push
          echo "==> 已提交 .keepalive ($ts)"
